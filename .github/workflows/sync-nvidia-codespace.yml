name: Sync NVIDIA secret to Codespaces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify NVIDIA credential
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            https://integrate.api.nvidia.com/v1/chat/completions \
            --header "Authorization: Bearer ${NVIDIA_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{"model":"nvidia/nemotron-3-ultra-550b-a55b","messages":[{"role":"user","content":"Reply with exactly OK"}],"max_tokens":8}')"

          echo "NVIDIA verification HTTP status: ${status}"
          if [[ "${status}" != "200" ]]; then
            echo "NVIDIA verification failed; no secret payload was created." >&2
            exit 1
          fi

      - name: Create encrypted Codespaces secret payload
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CODESPACES_PUBLIC_KEY: IYyvF2JIgut+BSZBQrhzD+cF5P0CyJR/pGrRijfrIgg=
          CODESPACES_KEY_ID: '3380189982652154440'
        run: |
          set -euo pipefail

          python3 -m pip install --quiet pynacl
          encrypted_value="$(python3 - <<'PY'
          import base64
          import os
          from nacl.public import PublicKey, SealedBox

          public_key = PublicKey(base64.b64decode(os.environ["CODESPACES_PUBLIC_KEY"]))
          plaintext = os.environ["NVIDIA_API_KEY"].encode("utf-8")
          encrypted = SealedBox(public_key).encrypt(plaintext)
          print(base64.b64encode(encrypted).decode("ascii"))
          PY
          )"

          jq -n \
            --arg encrypted_value "${encrypted_value}" \
            --arg key_id "${CODESPACES_KEY_ID}" \
            '{encrypted_value: $encrypted_value, key_id: $key_id}' \
            > nvidia-secret-payload.json

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-secret-payload
          path: nvidia-secret-payload.json
          retention-days: 1
